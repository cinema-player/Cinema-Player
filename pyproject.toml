[project]
name = "cinema-player"
version = "0.3.6-Beta"
description = "Two-instance mpv video player for a small private cinema"
requires-python = ">=3.12"
dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
# xft rasterises with FreeType. The noxft build draws the clock as a scaled bitmap.
tk = { version = "8.6.*", build = "xft_*" }
xorg-libxft = ">=2.3.9"
ffmpeg = "*"

[tool.pixi.tasks]
start = "python python/cinema_player.py"
