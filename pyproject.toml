[project]
name = "cinema-player"
version = "1.1.1"
description = "Two-instance mpv video player for a small private cinema"
requires-python = ">=3.12"
dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
tk = "*"
ffmpeg = "*"

[tool.pixi.tasks]
start = "python python/cinema_player.py"
