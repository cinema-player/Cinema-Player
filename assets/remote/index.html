<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <title>Cinema Player</title>
  <style>
    :root {
      --bg: #111;
      --panel: #1c1c1c;
      --text: #eee;
      --muted: #9a9a9a;
      --off: #c62828;
      --program: #1565c0;
      --playing: #2e9d3a;
      --cal: #500070;
      --btn: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(12px + env(safe-area-inset-top)) 16px 0;
    }
    h1 { font-size: 1.05rem; margin: 0 0 8px; font-weight: 700; letter-spacing: .04em; }
    .status {
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      background: var(--off);
      color: #fff;
    }
    .status .name { font-size: 1.15rem; font-weight: 700; }
    .status .meta { opacity: .9; font-size: .9rem; margin-top: 4px; }
    .clocks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .clock {
      background: var(--panel);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .clock span { display: block; color: var(--muted); font-size: .75rem; }
    .clock b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .clock.primary b { font-size: 1.7rem; }
    .clock.minor b { font-size: 1rem; color: #c8c8c8; }
    .lights {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
      padding: 10px 10px 12px;
      border-radius: 14px;
      background: #241c14;
      border: 1px solid #6a4a22;
    }
    .lights[hidden] { display: none; }
    .lights .caption {
      color: #e0b060;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lights .scenes { display: flex; flex-wrap: wrap; gap: 8px; }
    .lights .scenes button {
      flex: 1 1 6rem;
      min-height: 52px;
      padding: 12px 6px;
      font-size: .92rem;
      background: #3a2a18;
      color: #f3e2c4;
    }
    .timeline { margin-bottom: 16px; }
    .bar {
      height: 8px;
      background: #333;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--playing);
    }
    .bar[hidden], #seek[hidden], #envelope[hidden], #save-volume[hidden], .vol[hidden] { display: none; }
    #seek { width: 100%; margin: 0; accent-color: var(--cal); }
    #envelope {
      display: block;
      width: 100%;
      height: 44px;
      margin-top: 6px;
      border-radius: 10px;
      background: var(--panel);
      touch-action: none;
    }
    #envelope.seekable { cursor: pointer; }
    #save-volume { width: 100%; min-height: 44px; margin-top: 8px; padding: 10px 12px; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
      padding-top: 4px;
    }
    #resume {
      grid-column: 1 / -1;
      min-height: 84px;
      font-size: 1.25rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #resume[data-reaction="program"] { box-shadow: inset 0 0 0 3px var(--program); }
    #resume[data-reaction="playing"] { box-shadow: inset 0 0 0 3px var(--playing); }
    #resume.reaction-program,
    #resume.reaction-playing {
      color: #fff;
      box-shadow: none;
      opacity: 1;
    }
    #resume.reaction-program { background: var(--program); }
    #resume.reaction-playing { background: var(--playing); }
    #stop { grid-column: 2; background: var(--off); color: #fff; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--btn);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      padding: 18px 8px;
      min-height: 64px;
    }
    button:disabled { opacity: .35; }
    button.active { outline: 3px solid #fff; }
    @keyframes light-blink {
      0%, 100% { outline-color: #fff; background: #c9a227; color: #1a1408; }
      50% { outline-color: transparent; background: #3a2a18; color: #f3e2c4; }
    }
    .lights button.fading {
      outline: 3px solid #fff;
      animation: light-blink .6s ease-in-out infinite;
    }
    .lights button.active { background: #c9a227; color: #1a1408; }
    .vol { margin-bottom: 16px; }
    .vol label { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 6px; }
    input[type=range] { width: 100%; }
    .list {
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      flex: 1 1 auto;
    }
    .dock {
      position: sticky;
      bottom: 0;
      z-index: 5;
      margin-top: auto;
      background: rgba(17, 17, 17, .96);
      border-top: 1px solid #2a2a2a;
      padding-top: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }
    .row {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #2a2a2a;
      font-size: .92rem;
      cursor: pointer;
    }
    .row[data-disabled="1"] { cursor: default; }
    .row:first-child { border-top: 0; }
    .row.current { background: #16325a; }
    .row.playing { background: #1a4a22; }
    .row .n { width: 1.6rem; color: var(--muted); }
    .row .f { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .err { color: #ff8a80; font-size: .85rem; min-height: 1.2em; margin: 0 0 10px; }
    .token { margin-bottom: 12px; }
    .token input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 0;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
    }
    .modal[hidden] { display: none; }
    .offline {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(150, 150, 150, .78);
      backdrop-filter: grayscale(1);
      color: #f4f4f4;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .offline[hidden] { display: none; }
    #input-shield {
      position: fixed;
      inset: 0;
      z-index: 35;
      background: transparent;
    }
    #input-shield[hidden] { display: none; }
    .dialog {
      background: var(--panel);
      border-radius: 16px;
      padding: 20px 18px 16px;
      width: min(420px, 100%);
    }
    .dialog h2 { margin: 0 0 10px; font-size: 1.15rem; }
    .dialog p { margin: 0 0 18px; color: var(--muted); line-height: 1.4; }
    .dialog .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dialog .yes { background: var(--off); color: #fff; }
  </style>
</head>
<body>
  <h1>Cinema Player</h1>
  <div id="token-box" class="token">
    <input id="token" type="password" autocomplete="off" placeholder="Token">
  </div>
  <p class="err" id="err"></p>
  <div class="status" id="status">
    <div class="name" id="state">…</div>
    <div class="meta" id="clip"></div>
  </div>
  <div class="timeline">
    <div class="bar"><i id="progress"></i></div>
    <input id="seek" type="range" min="0" max="1" step="0.1" value="0" hidden>
    <canvas id="envelope" hidden></canvas>
  </div>
  <div class="clocks">
    <div class="clock primary"><span data-i="remaining">Remaining</span><b id="t-remaining">--:--</b></div>
    <div class="clock primary"><span data-i="end">End</span><b id="t-end">--:--</b></div>
    <div class="clock minor"><span data-i="total">Total</span><b id="t-total">--:--</b></div>
    <div class="clock minor"><span data-i="elapsed">Elapsed</span><b id="t-elapsed">--:--</b></div>
  </div>
  <div class="list" id="playlist"></div>
  <div class="dock">
  <div class="lights" id="lights" hidden>
    <div class="caption" id="light-caption">Lights</div>
    <div id="light-scenes" class="scenes"></div>
  </div>
  <div class="actions">
    <button id="resume" type="button" disabled>Start</button>
    <button id="pause" type="button">Pause</button>
    <button id="still" type="button">Still</button>
    <button id="stop" type="button">Stop</button>
  </div>
  <div class="vol">
    <label><span data-i="volume">Volume</span><b id="vol-label">100</b></label>
    <input id="volume" type="range" min="0" max="100" value="100">
    <button id="save-volume" type="button">Save volume</button>
  </div>
  </div>
  <div id="offline" class="offline" hidden>Offline</div>
  <div id="input-shield" hidden></div>
  <div class="modal" id="confirm" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="choices">
        <button type="button" id="confirm-no">No</button>
        <button type="button" class="yes" id="confirm-yes">Yes</button>
      </div>
    </div>
  </div>
  <script>
    const I18N = {
      en: { start: "Start", resume: "Resume", pause: "Pause", still: "Still", stop: "Stop", volume: "Volume",
            total: "Total", elapsed: "Elapsed", remaining: "Remaining", end: "End",
            lights_control: "House lights",
            token: "Token", yes: "Yes", no: "No",
            pause_title: "Pause",
            pause_message: "Pause playback? The projector output will go black.",
            still_title: "Still",
            still_message: "Freeze the current frame on the projector?",
            stop_title: "Stop",
            stop_message: "Stop the current clip?",
            set_program: "Set program pointer",
            program_message: "Set the program pointer to {name}?",
            save_volume: "Save volume" },
      de: { start: "Start", resume: "Weiter", pause: "Pause", still: "Standbild", stop: "Stop", volume: "Lautstärke",
            total: "Gesamt", elapsed: "Gelaufen", remaining: "Rest", end: "Ende",
            lights_control: "Lichtsteuerung",
            token: "Token", yes: "Ja", no: "Nein",
            pause_title: "Pause",
            pause_message: "Wiedergabe pausieren? Die Beamerausgabe wird schwarz.",
            still_title: "Standbild",
            still_message: "Aktuelles Bild auf dem Beamer einfrieren?",
            stop_title: "Stop",
            stop_message: "Aktuellen Clip stoppen?",
            set_program: "Programmzeiger setzen",
            program_message: "Programmzeiger auf {name} setzen?",
            save_volume: "Lautstärke speichern" }
    };
    const tokenInput = document.getElementById("token");
    const colors = { OFF: "var(--off)", PROGRAM: "var(--program)", PLAYING: "var(--playing)" };
    let lastVolume = 100;
    let dragging = false;
    let seeking = false;
    let envelopeSeeking = false;
    let skipTransportConfirm = false;
    let uiLang = "en";
    let lastState = "OFF";
    let seenStatus = false;
    let transportReadyAt = Infinity;
    let shieldTimer = 0;
    let resumeLit = null;
    let resumeLitTimer = 0;
    const params = new URLSearchParams(location.search);
    const qToken = (params.get("token") || "").trim();
    const qLang = params.get("lang");
    if (qLang === "de" || qLang === "en") uiLang = qLang;
    if (qToken) {
      tokenInput.value = qToken;
      sessionStorage.setItem("cinema-token", qToken);
      document.getElementById("token-box").hidden = true;
      params.delete("token");
      const qs = params.toString();
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
    } else {
      tokenInput.value = sessionStorage.getItem("cinema-token") || "";
    }

    function headers() {
      const token = tokenInput.value.trim();
      const h = { "Content-Type": "application/json" };
      if (token) h["X-Cinema-Token"] = token;
      return h;
    }

    async function api(path, method, body) {
      const res = await fetch(path, {
        method: method || "GET",
        headers: headers(),
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json();
      if (res.status === 401) {
        document.getElementById("token-box").hidden = false;
        throw new Error("unauthorized");
      }
      return data;
    }

    function applyLang(lang) {
      const table = I18N[lang] || I18N.en;
      document.getElementById("resume").textContent =
        lastState === "OFF" ? table.start : table.resume;
      document.getElementById("pause").textContent = table.pause;
      document.getElementById("still").textContent = table.still;
      document.getElementById("stop").textContent = table.stop;
      document.getElementById("light-caption").textContent = table.lights_control;
      document.querySelector('[data-i="volume"]').textContent = table.volume;
      document.querySelector('[data-i="total"]').textContent = table.total;
      document.querySelector('[data-i="elapsed"]').textContent = table.elapsed;
      document.querySelector('[data-i="remaining"]').textContent = table.remaining;
      document.querySelector('[data-i="end"]').textContent = table.end;
      tokenInput.placeholder = table.token;
      document.getElementById("confirm-yes").textContent = table.yes;
      document.getElementById("confirm-no").textContent = table.no;
      document.getElementById("save-volume").textContent = table.save_volume;
    }
    applyLang(uiLang);

    function render(data) {
      if (data.ok !== false && tokenInput.value.trim()) {
        document.getElementById("token-box").hidden = true;
      }
      const err = document.getElementById("err");
      err.textContent = data.ok === false && data.error && data.error !== "unauthorized"
        ? data.error : "";
      const state = data.state || "OFF";
      document.getElementById("state").textContent = data.state_label || state;
      document.getElementById("status").style.background =
        (data.calibration || data.volume_setup) ? "var(--cal)" : (colors[state] || colors.OFF);
      const clip = data.clip || {};
      document.getElementById("clip").textContent = clip.filename
        ? `${(clip.index || 0) + 1} · ${clip.filename}`
        : "";
      const times = data.times || {};
      document.getElementById("t-total").textContent = times.total || "--:--";
      document.getElementById("t-elapsed").textContent = times.elapsed || "--:--";
      document.getElementById("t-remaining").textContent = times.remaining || "--:--";
      document.getElementById("t-end").textContent = times.end || "--:--";
      document.getElementById("progress").style.width =
        `${Math.round((times.progress || 0) * 100)}%`;
      const actions = data.actions || {};
      const resumeButton = document.getElementById("resume");
      resumeButton.disabled = !actions.resume;
      resumeButton.dataset.reaction = actions.resume
        ? (state === "PLAYING" ? "playing" : "program")
        : "";
      lastState = state;
      document.getElementById("pause").disabled = !actions.pause;
      document.getElementById("still").disabled = !actions.still;
      document.getElementById("stop").disabled = !actions.stop;
      document.getElementById("pause").classList.toggle("active", !!data.paused);
      document.getElementById("still").classList.toggle("active", !!data.still);
      skipTransportConfirm = actions.confirm_transport === false;
      document.getElementById("save-volume").hidden = !actions.save_volume;
      document.querySelector(".vol").hidden = actions.volume === false || !!(clip && clip.is_image);
      const seek = document.getElementById("seek");
      const canSeek = !!actions.seek && Number(clip.duration) > 0;
      seek.hidden = !canSeek;
      document.querySelector(".bar").hidden = canSeek;
      if (canSeek && !seeking && !envelopeSeeking) {
        seek.max = clip.duration;
        seek.value = clip.position || 0;
      }
      if (!envelopeSeeking) renderEnvelope(clip, times, canSeek);
      const lights = data.lights || {};
      const lightsOn = lights.enabled === true;
      const preset = lights.preset || "";
      document.getElementById("lights").hidden = !lightsOn;
      renderScenes(lights, lightsOn, preset);
      if (!dragging && typeof data.volume === "number") {
        lastVolume = data.volume;
        document.getElementById("volume").value = data.volume;
        document.getElementById("vol-label").textContent = data.volume;
      }
      uiLang = data.language || "en";
      applyLang(uiLang);
      paintResumeReaction();
      const list = document.getElementById("playlist");
      const canCue = !!(actions.set_program);
      list.innerHTML = (data.playlist || []).map((row) => {
        const cls = row.current && state === "PLAYING" ? "row playing"
          : row.current ? "row current" : "row";
        const disabled = !canCue || row.missing || row.current;
        const marks = [
          row.loop ? "LOOP" : "",
          row.autoplay ? "AUTO" : "",
          row.played ? "●" : "",
          row.missing ? "!" : ""
        ].filter(Boolean).join(" ");
        return `<div class="${cls}" data-index="${row.index}" data-name="${esc(row.filename)}" data-disabled="${disabled ? "1" : "0"}">` +
          `<span class="n">${row.index + 1}</span>` +
          `<span class="f">${esc(row.filename)}</span>` +
          `<span>${esc(row.duration_label)}${marks ? " " + marks : ""}</span></div>`;
      }).join("");
    }

    function esc(text) {
      return String(text || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function setOffline(offline) {
      const panel = document.getElementById("offline");
      const wasOffline = !panel.hidden;
      panel.hidden = !offline;
      if (offline) {
        document.getElementById("err").textContent = "";
        transportReadyAt = Infinity;
        clearTimeout(shieldTimer);
        document.getElementById("input-shield").hidden = true;
      }
      return wasOffline && !offline;
    }

    function holdTransport() {
      // A reconnect can deliver the tap that was on the offline veil to Start.
      const wait = 600;
      transportReadyAt = Date.now() + wait;
      const shield = document.getElementById("input-shield");
      shield.hidden = false;
      clearTimeout(shieldTimer);
      shieldTimer = setTimeout(() => { shield.hidden = true; }, wait);
    }

    function connectionLost(exc) {
      return !exc || exc.message !== "unauthorized";
    }

    async function poll() {
      try {
        render(await api("/api/status"));
        const cameOnline = setOffline(false);
        if (!seenStatus || cameOnline) {
          seenStatus = true;
          holdTransport();
        }
      } catch (exc) {
        if (!connectionLost(exc)) {
          setOffline(false);
          document.getElementById("err").textContent = exc.message;
          return;
        }
        setOffline(true);
      }
    }

    async function command(path, method, body) {
      try {
        render(await api(path, method, body));
        setOffline(false);
      } catch (exc) {
        if (!connectionLost(exc)) {
          setOffline(false);
          document.getElementById("err").textContent = exc.message;
          return;
        }
        setOffline(true);
      }
    }

    const confirmBox = document.getElementById("confirm");
    let confirmAction = null;

    function askConfirm(kind, path, extra) {
      extra = extra || {};
      const table = I18N[uiLang] || I18N.en;
      if (kind === "program") {
        document.getElementById("confirm-title").textContent = table.set_program;
        document.getElementById("confirm-text").textContent =
          table.program_message.replace("{name}", extra.name || "");
      } else {
        document.getElementById("confirm-title").textContent = table[kind + "_title"];
        document.getElementById("confirm-text").textContent = table[kind + "_message"];
      }
      confirmAction = { path: path, body: extra.body || null };
      confirmBox.hidden = false;
    }

    function closeConfirm() {
      confirmAction = null;
      confirmBox.hidden = true;
    }

    function renderEnvelope(clip, times, canSeek) {
      const canvas = document.getElementById("envelope");
      const peaks = clip && clip.envelope;
      const show = Array.isArray(peaks) && peaks.length >= 2;
      canvas.hidden = !show;
      canvas.classList.toggle("seekable", !!(show && canSeek));
      canvas.dataset.duration = show ? String(clip.duration || 0) : "0";
      canvas.dataset.seek = canSeek ? "1" : "0";
      canvas._peaks = show ? peaks : null;
      if (!show) return;
      const duration = Number(clip.duration) || 0;
      const position = Number(clip.position) || 0;
      const progress = duration > 0 ? position / duration : (times.progress || 0);
      if (canvas.clientWidth < 2) {
        requestAnimationFrame(() => drawEnvelope(peaks, progress));
        return;
      }
      drawEnvelope(peaks, progress);
    }

    function drawEnvelope(peaks, progress) {
      const canvas = document.getElementById("envelope");
      const dpr = window.devicePixelRatio || 1;
      const cssW = Math.max(1, canvas.clientWidth || canvas.parentElement.clientWidth || 1);
      const cssH = 44;
      if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = "#1c1c1c";
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.strokeStyle = "#333";
      ctx.strokeRect(0.5, 0.5, cssW - 1, cssH - 1);
      const mid = cssH / 2;
      ctx.beginPath();
      ctx.moveTo(1, mid);
      ctx.lineTo(cssW - 1, mid);
      ctx.stroke();
      const amp = Math.max(1, mid - 2);
      ctx.beginPath();
      peaks.forEach((peak, index) => {
        const level = Math.max(0, Math.min(1, Number(peak) || 0));
        const x = (index + 0.5) * cssW / peaks.length;
        const y = mid - level * amp;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      for (let index = peaks.length - 1; index >= 0; index -= 1) {
        const level = Math.max(0, Math.min(1, Number(peaks[index]) || 0));
        const x = (index + 0.5) * cssW / peaks.length;
        ctx.lineTo(x, mid + level * amp);
      }
      ctx.closePath();
      ctx.fillStyle = "#2ee8dc";
      ctx.fill();
      const ratio = Math.max(0, Math.min(1, Number(progress) || 0));
      const px = ratio * cssW;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, 1);
      ctx.lineTo(px, cssH - 1);
      ctx.stroke();
    }

    function renderScenes(lights, lightsOn, preset) {
      const holder = document.getElementById("light-scenes");
      const scenes = lights.scenes || [];
      const signature = scenes.map((scene) => scene.id + "\n" + scene.name).join("\n");
      if (holder.dataset.signature !== signature) {
        holder.dataset.signature = signature;
        holder.innerHTML = scenes.map((scene) =>
          `<button type="button" data-scene="${esc(scene.id)}">${esc(scene.name)}</button>`
        ).join("");
        holder.querySelectorAll("button").forEach((button) => {
          button.onclick = () => command("/api/lights", "POST", { preset: button.dataset.scene });
        });
      }
      holder.querySelectorAll("button").forEach((button) => {
        const key = button.dataset.scene;
        button.disabled = !lightsOn;
        button.classList.toggle("fading", lightsOn && !!lights.fading && preset === key);
        button.classList.toggle("active", lightsOn && preset === key && !lights.fading);
      });
    }

    function transport(kind, path) {
      if (skipTransportConfirm) command(path, "POST");
      else askConfirm(kind, path);
    }

    function paintResumeReaction() {
      const button = document.getElementById("resume");
      const lit = resumeLit && (
        Date.now() < resumeLit.until || (resumeLit.pending && lastState !== resumeLit.expect)
      );
      button.classList.toggle("reaction-program", !!(lit && resumeLit.kind === "program"));
      button.classList.toggle("reaction-playing", !!(lit && resumeLit.kind === "playing"));
      if (resumeLit && !lit) resumeLit = null;
    }

    async function pressResume() {
      const button = document.getElementById("resume");
      if (button.disabled || button.dataset.busy === "1") return;
      if (Date.now() < transportReadyAt) return;
      if (!document.getElementById("offline").hidden) return;
      button.dataset.busy = "1";
      // Blue arms a stopped show. Every later Weiter rolls or continues, in green.
      // The fill stays until the show reports that state, and at least a moment
      // when the answer comes back immediately.
      const kind = lastState === "OFF" ? "program" : "playing";
      resumeLit = {
        kind: kind,
        expect: kind === "program" ? "PROGRAM" : "PLAYING",
        until: Date.now() + 700,
        pending: true,
      };
      paintResumeReaction();
      try {
        await command("/api/resume", "POST");
      } finally {
        delete button.dataset.busy;
        if (resumeLit) resumeLit.pending = false;
        paintResumeReaction();
        clearTimeout(resumeLitTimer);
        if (resumeLit) {
          resumeLitTimer = setTimeout(paintResumeReaction, Math.max(0, resumeLit.until - Date.now()) + 40);
        }
      }
    }

    document.getElementById("resume").addEventListener("click", (event) => {
      if (!event.isTrusted) return;
      if (event.button !== undefined && event.button !== 0) return;
      pressResume();
    });
    document.getElementById("pause").onclick = () => transport("pause", "/api/pause");
    document.getElementById("still").onclick = () => transport("still", "/api/still");
    document.getElementById("stop").onclick = () => transport("stop", "/api/stop");
    document.getElementById("save-volume").onclick = () => command("/api/volume/save", "POST");
    document.getElementById("confirm-yes").onclick = () => {
      const action = confirmAction;
      closeConfirm();
      if (action) command(action.path, "POST", action.body);
    };
    document.getElementById("confirm-no").onclick = closeConfirm;
    confirmBox.addEventListener("click", (event) => {
      if (event.target === confirmBox) closeConfirm();
    });
    document.getElementById("playlist").addEventListener("click", (event) => {
      const row = event.target.closest("[data-index]");
      if (!row || row.dataset.disabled === "1") return;
      askConfirm("program", "/api/program", {
        name: row.dataset.name,
        body: { index: Number(row.dataset.index) },
      });
    });
    const slider = document.getElementById("volume");
    slider.addEventListener("pointerdown", () => { dragging = true; });
    slider.addEventListener("pointerup", () => { dragging = false; });
    slider.addEventListener("input", () => {
      document.getElementById("vol-label").textContent = slider.value;
    });
    slider.addEventListener("change", () => {
      command("/api/volume", "PUT", { volume: Number(slider.value) });
    });
    const seek = document.getElementById("seek");
    seek.addEventListener("pointerdown", () => { seeking = true; });
    seek.addEventListener("pointerup", () => { seeking = false; });
    seek.addEventListener("change", () => {
      seeking = false;
      command("/api/seek", "POST", { position: Number(seek.value) });
    });
    const envelope = document.getElementById("envelope");
    let envelopeSentAt = 0;
    function envelopePosition(event) {
      const duration = Number(envelope.dataset.duration) || 0;
      if (duration <= 0) return null;
      const rect = envelope.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      return { position: ratio * duration, ratio: ratio, duration: duration };
    }
    function dragEnvelope(event, send) {
      const at = envelopePosition(event);
      if (!at) return;
      if (envelope._peaks) drawEnvelope(envelope._peaks, at.ratio);
      const seekBar = document.getElementById("seek");
      if (!seekBar.hidden) seekBar.value = at.position;
      const now = Date.now();
      if (send || now - envelopeSentAt > 120) {
        envelopeSentAt = now;
        command("/api/seek", "POST", { position: at.position });
      }
    }
    envelope.addEventListener("pointerdown", (event) => {
      if (envelope.hidden || envelope.dataset.seek !== "1") return;
      envelopeSeeking = true;
      seeking = true;
      try { envelope.setPointerCapture(event.pointerId); } catch (exc) {}
      dragEnvelope(event, true);
    });
    envelope.addEventListener("pointermove", (event) => {
      if (!envelopeSeeking) return;
      dragEnvelope(event, false);
    });
    envelope.addEventListener("pointerup", (event) => {
      if (!envelopeSeeking) return;
      envelopeSeeking = false;
      seeking = false;
      dragEnvelope(event, true);
    });
    envelope.addEventListener("pointercancel", () => {
      envelopeSeeking = false;
      seeking = false;
    });
    window.addEventListener("resize", () => poll());
    tokenInput.addEventListener("change", () => {
      sessionStorage.setItem("cinema-token", tokenInput.value.trim());
      poll();
    });
    poll();
    setInterval(poll, 500);
  </script>
</body>
</html>
